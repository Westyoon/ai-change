name = "ai-change"
main = "src/index.ts"
compatibility_date = "2026-08-28"

# Before production, configure PUBLIC_ORIGIN as an environment variable with
# the exact canonical HTTPS origin (for example, https://your-domain.example).

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "ai-change"
database_id = "15814753-6db9-405b-b27c-de3a23856e92"
migrations_dir = "migrations"
