name = "ai-change"
main = "src/index.ts"
compatibility_date = "2026-08-28"

# Before production, configure PUBLIC_ORIGIN as an environment variable with
# the exact canonical HTTPS origin (for example, https://your-domain.example).
[vars]
PUBLIC_ORIGIN = "https://ai-change.ai-change-backend.workers.dev"

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "ai-change"
database_id = "942d8f14-dc06-4460-b6c5-dfb0c07eab78"
migrations_dir = "migrations"
