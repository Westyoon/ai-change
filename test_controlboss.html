<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>After Control Boss - Mobile Preview</title>
  <link rel="stylesheet" href="./css/minigames.css" />
  <link rel="stylesheet" href="./css/after_control_boss.css" />
  <style>
    body {
      margin: 0;
      padding: 20px 0;
      background: #18191f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
      user-select: none;
    }
    #game-container {
      width: 450px;
      height: 800px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6);
      border-radius: 28px;
      overflow: hidden;
      border: 4px solid #2d3039;
      background: #ffffff;
    }
    .hud-guide {
      margin-top: 14px;
      color: #adb5bd;
      font-size: 13px;
    }
    .hud-guide kbd {
      background: #2b2b36;
      color: #fff;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid #444;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div class="hud-guide">
    🎮 조작: <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> (이동) | <kbd>Space</kbd> (보스 공격)
  </div>

  <script type="module">
    import AfterControlBossMiniGame from './js/minigames/after_controlboss/index.js';

    async function bootstrap() {
      const container = document.getElementById('game-container');
      const res = await fetch('./data/minigames/after_controlboss.json?v=' + Date.now());
      const config = await res.json();

      const game = new AfterControlBossMiniGame({ container });
      await game.init(config);
      game.start();
    }

    bootstrap();
  </script>
</body>
</html>
