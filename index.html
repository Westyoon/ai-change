<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4a2441" />
    <meta name="ai-change-content-version" content="1" />
    <meta
      name="description"
      content="이화여자대학교 인공지능대학을 탐색하고 학과별 미니게임을 체험하는 반응형 웹게임"
    />
    <title>인지사전게임 · 제2회 인공지능대학 축제</title>
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/dialogue.css" />
    <link rel="stylesheet" href="./css/map.css" />
    <link rel="stylesheet" href="./css/minigames.css" />
    <link rel="stylesheet" href="./css/click-to-purify.css" />
    <link rel="stylesheet" href="./css/ai-ball-classification.css" />
    <link rel="stylesheet" href="./css/battle-character.css" />
    <link rel="stylesheet" href="./css/data-sphinx.css" />
    <link rel="stylesheet" href="./css/stat-boss.css" />
    <link rel="stylesheet" href="./css/control-boss.css" />
    <link rel="stylesheet" href="./css/xr-egg-trials.css" />
    <link rel="stylesheet" href="./css/battle.css" />
    <link rel="stylesheet" href="./css/account.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar" aria-label="인지사전게임 공통 헤더">
        <span class="build-badge">LIVE · v1</span>
        <nav class="top-nav" aria-label="빠른 메뉴">
          <button
            class="top-nav__button"
            type="button"
            data-top-route="account"
            aria-label="내 계정 열기"
            disabled
          >
            <svg class="top-nav__icon" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
              <rect x="6" y="1" width="4" height="4" fill="currentColor" />
              <rect x="4" y="2" width="8" height="2" fill="currentColor" />
              <rect x="3" y="7" width="10" height="2" fill="currentColor" />
              <rect x="2" y="9" width="12" height="5" fill="currentColor" />
              <rect x="1" y="11" width="2" height="4" fill="currentColor" />
              <rect x="13" y="11" width="2" height="4" fill="currentColor" />
            </svg>
            <span class="top-nav__label">내 계정</span>
          </button>
          <button
            class="top-nav__button"
            type="button"
            data-top-route="settings"
            aria-label="설정 열기"
            disabled
          >
            <svg class="top-nav__icon" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
              <rect x="6" y="1" width="4" height="3" fill="currentColor" />
              <rect x="6" y="12" width="4" height="3" fill="currentColor" />
              <rect x="1" y="6" width="3" height="4" fill="currentColor" />
              <rect x="12" y="6" width="3" height="4" fill="currentColor" />
              <rect x="4" y="4" width="8" height="8" fill="currentColor" />
              <rect x="6" y="6" width="4" height="4" fill="var(--paper)" />
            </svg>
            <span class="top-nav__label">설정</span>
          </button>
        </nav>
      </header>

      <main id="app" class="scene-root" tabindex="-1">
        <section class="scene scene--centered" aria-label="로딩 중">
          <p class="eyebrow">제2회 인공지능대학 축제</p>
          <img
            class="scene-brand-logo scene-brand-logo--loading"
            src="./assets/images/main%20logo.png"
            width="4335"
            height="2368"
            alt=""
          />
          <h1 class="visually-hidden">인지사전게임</h1>
          <p>애플리케이션을 준비하고 있습니다.</p>
        </section>
      </main>

      <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
    </div>

    <noscript>
      <p class="noscript-message">이 게임을 실행하려면 JavaScript를 활성화해 주세요.</p>
    </noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
