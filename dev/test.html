<!-- dev/test.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  body {
    background: #05070c; color: #eee; font-family: monospace;
    display: flex; flex-wrap: wrap; gap: 20px; padding: 20px;
    justify-content: center;
  }
  #stage { width: 100%; max-width: 480px; position: relative; }
  canvas {
    background: #0a0d14; border: 1px solid #333; border-radius: 8px;
    width: 100%; height: auto; aspect-ratio: 1 / 1; display: block;
  }
  #panel { width: 100%; max-width: 300px; }
  button { margin-bottom: 6px; padding: 10px; width: 100%; cursor: pointer; font-size: 14px; }

  /* 설명 화면(인트로 모달) */
  #intro-modal {
    position: fixed; inset: 0; background: rgba(5,7,12,0.6); /* 반투명 - 뒤에 게임 화면 살짝 비침 */
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  #intro-box {
    background: rgba(20,24,31,0.95); border: 2px solid #37e6ff; border-radius: 10px;
    padding: 20px; max-width: 340px; position: relative; font-size: 13px;
  }
  #intro-close {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
    padding: 0; background: #3a3f4a; border: 1px solid #37e6ff; border-radius: 4px;
  }
  #intro-box h2 { margin: 0 0 10px; font-size: 16px; }
  .intro-rule { margin: 4px 0; }
  .intro-legend { list-style: none; padding: 0; margin: 10px 0 0; }
  .intro-legend li { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .intro-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  @media (max-width: 600px) {
    body { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>
  <!-- 설명 화면 -->
  <div id="intro-modal">
    <div id="intro-box">
      <button id="intro-close">✕</button>
      <h2>CLICK to PURIFY</h2>
      <p class="intro-rule">🛡️ 몰려드는 악성코드로부터 CORE를 지켜라!</p>
      <p class="intro-rule">❌ MISS 3회 = 방어 실패</p>
      <ul class="intro-legend">
        <li><span class="intro-dot" style="background:#ff8c37"></span> TROJAN — 위장 중엔 못 눌러요, 정체 드러나면 CLICK!</li>
        <li><span class="intro-dot" style="background:#2e8b57"></span> WORM — 놓치면 2마리로 분열!</li>
        <li><span class="intro-dot" style="background:#8b3fd1"></span> RANSOM — 놓치면 코어 입력 잠김!</li>
        <li><span class="intro-dot" style="background:#5a7a9c"></span> SPYWARE — 그림자 속에 숨어 접근... 가까워질수록 실체를 드러낸다</li>
      </ul>
    </div>
  </div>

  <div id="stage">
    <canvas id="game-canvas" width="480" height="480"></canvas>
  </div>
  <div id="panel">
    <button id="btn-start" style="display:none;">START</button>
    <div id="ui-root"></div>
  </div>

  <script type="module">
    import { createMiniGame } from "../js/minigames/CS/index.js";
    import config from "../data/minigames/click-to-purify.json" with { type: "json" };

    const game = createMiniGame({
      canvas: document.getElementById("game-canvas"),
      uiRoot: document.getElementById("ui-root"),
      onComplete(result) {
        alert("게임 종료: " + JSON.stringify(result));
      },
    });

    // 설명 화면 X 누르면 -> init 실행하고, 화면 닫고, 시작하기 버튼 보여줌
    document.getElementById("intro-close").onclick = () => {
      document.getElementById("intro-modal").style.display = "none";
      document.getElementById("btn-start").style.display = "block";
      game.init(config);
    };

    document.getElementById("btn-start").onclick = () => game.start();
  </script>
</body>
</html>
